# conf.d/nginx/default.conf YANG BENAR
server {
    listen $port;
    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # Header keamanan dasar
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    # Aturan routing utama untuk Laravel
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Jangan catat log untuk file-file ini
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Tangani error 404 melalui Laravel
    error_page 404 /index.php;

    # Aturan untuk memproses file PHP melalui PHP-FPM
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php-fpm.sock; # Menggunakan socket lebih baik
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Blok akses ke file .htaccess dan file tersembunyi lainnya
    location ~ /\.(?!well-known).* {
        deny all;
    }
}